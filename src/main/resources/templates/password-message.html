<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en-US">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title>AlgaShop - Result</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
    <style>
        .message-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            padding: 20px;
            text-align: center;
        }

        .message-content p {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            margin: 0;
        }

        .message-icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #D10024;
        }

        .message-success {
            color: #28a745;
        }

        .message-error {
            color: #dc3545;
        }

        @media (max-width: 480px) {
            .container {
                width: 100%;
                padding: 0 10px;
                margin: 10px auto;
            }

            .wrapper {
                border-radius: 0;
            }

            .wrapper .title {
                height: 80px;
                font-size: 24px;
            }

            .message-content {
                min-height: 150px;
                padding: 15px;
            }

            .message-icon {
                font-size: 36px;
            }

            .message-content p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="wrapper">
        <div class="title">
            <div class="header-logo">
                <a href="#" class="logo">
                    <img src="/img/logo.png" alt="AlgaShop">
                </a>
            </div>
        </div>
        <div class="message-content">
            <p th:text="${message}"></p>
        </div>
    </div>
</div>
</body>
</html>
